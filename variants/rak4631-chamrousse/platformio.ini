  -DUSERPREFS_DEVICE_REBROADCAST_MODE=meshtastic_Config_DeviceConfig_RebroadcastMode_CORE_PORTNUMS_ONLY
  -DUSERPREFS_LORACONFIG_CHANNEL_NUM=1
  -DUSERPREFS_LORACONFIG_MODEM_PRESET=meshtastic_Config_LoRaConfig_ModemPreset_LONG_MODERATE
  -DUSERPREFS_TZ_STRING=\"CET-1CEST,M3.5.0,M10.5.0/3\"
  -DUSERPREFS_USE_ADMIN_KEY_0={0x26,0x04,0xdb,0x02,0xbc,0x20,0x2e,0xac,0x20,0x4f,0x4f,0xeb,0xdc,0x4b,0x60,0xfd,0x11,0x31,0xed,0x89,0xc2,0x96,0x27,0xa0,0x01,0x27,0x7d,0xe8,0x74,0x8d,0xef,0x07}
  -DUSERPREFS_USE_ADMIN_KEY_1={0xbc,0x8a,0xbd,0x69,0xea,0x1c,0x2c,0xba,0xfc,0x67,0x1f,0x11,0x2b,0x56,0x7b,0xe0,0xd0,0xb1,0xa8,0x55,0x84,0x2b,0xc0,0x8d,0x84,0x7e,0xd4,0xe8,0x0b,0x04,0xac,0x66}
  -DUSERPREFS_USE_ADMIN_KEY_2={0x57,0x7b,0x11,0xd3,0x55,0x06,0x50,0x46,0x87,0x8d,0x56,0x8e,0xb2,0x82,0x60,0xe0,0x31,0x4b,0x2f,0x35,0x64,0x49,0x17,0x7c,0x9c,0x70,0x1f,0x29,0xa2,0x56,0xbc,0x5b}
build_src_filter = ${nrf52_base.build_src_filter} +<../variants/rak4631> +<mesh/eth/> +<mesh/api/> +<mqtt/>
lib_deps = 
  ${nrf52840_base.lib_deps}
  ${networking_base.lib_deps}
  melopero/Melopero RV3028@^1.1.0
  https://github.com/RAKWireless/RAK13800-W5100S/archive/1.0.2.zip
  rakwireless/RAKwireless NCP5623 RGB LED library@^1.0.2
  https://github.com/RAKWireless/RAK12034-BMX160/archive/dcead07ffa267d3c906e9ca4a1330ab989e957e2.zip

; If not set we will default to uploading over serial (first it forces bootloader entry by talking 1200bps to cdcacm)
; Note: as of 6/2013 the serial/bootloader based programming takes approximately 30 seconds
;upload_protocol = jlink

; Allows programming and debug via the RAK NanoDAP as the default debugger tool for the RAK4631 (it is only $10!)
; programming time is about the same as the bootloader version.
; For information on this see the meshtastic developers documentation for "Development on the NRF52"
[env:rak4631_dbg]
extends = env:rak4631
board_level = extra

; if the builtin version of openocd has a buggy version of semihosting, so use the external version
; platform_packages = platformio/tool-openocd@^3.1200.0

build_flags =
  ${env:rak4631.build_flags}
  -D USE_SEMIHOSTING

lib_deps =
  ${env:rak4631.lib_deps}
  https://github.com/geeksville/Armduino-Semihosting/archive/35b538fdf208c3530c1434cd099a08e486672ee4.zip

; NOTE: the pyocd support for semihosting is buggy.  So I switched to using the builtin platformio support for the stlink adapter which worked much better.
; However the built in openocd version in platformio has buggy support for TCP to semihosting. 
;
; So I'm now trying the external openocd - but the openocd scripts for nrf52.cfg assume you are using a DAP adapter not an STLINK adapter.
; In theory I could change those scripts.  But for now I'm trying going back to a DAP adapter but with the external openocd.

upload_protocol = stlink
; eventually use platformio/tool-pyocd@^2.3600.0 instad
;upload_protocol = custom
;upload_command = pyocd flash -t nrf52840 $UPLOADERFLAGS $SOURCE