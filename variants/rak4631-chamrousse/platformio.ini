; The very slick RAK wireless RAK 4631 / 4630 board - Unified firmware for 5005/19003, with or without OLED RAK 1921
[env:rak4631-chamrousse]
extends = nrf52840_base
board = wiscore_rak4631
board_check = true
build_flags = ${nrf52840_base.build_flags} -Ivariants/rak4631-chamrousse -D RAK_4631
  -L "${platformio.libdeps_dir}/${this.__env__}/bsec2/src/cortex-m4/fpv4-sp-d16-hard"
  -DGPS_POWER_TOGGLE ; comment this line to disable triple press function on the user button to turn off gps entirely.
  -DEINK_DISPLAY_MODEL=GxEPD2_213_BN
  -DEINK_WIDTH=250
  -DEINK_HEIGHT=122
  -DRADIOLIB_EXCLUDE_SX128X=1
  -DRADIOLIB_EXCLUDE_SX127X=1
  -DRADIOLIB_EXCLUDE_LR11X0=1
  -DMESHTASTIC_EXCLUDE_AUDIO=1
  -DMESHTASTIC_EXCLUDE_DETECTIONSENSOR=1
  -DMESHTASTIC_EXCLUDE_RANGETEST=1
  -DMESHTASTIC_EXCLUDE_ATAK=1
  -DMESHTASTIC_EXCLUDE_INPUTBROKER=1
  -DMESHTASTIC_EXCLUDE_HEALTH_TELEMETRY=1
  -DMESHTASTIC_EXCLUDE_WIFI=1
  -DMESHTASTIC_EXCLUDE_SCREEN=1
  -DMESHTASTIC_EXCLUDE_POWER_FSM=1
  -DMESHTASTIC_EXCLUDE_EXTERNALNOTIFICATION=1
  -DMESHTASTIC_EXCLUDE_PAXCOUNTER=1
  -DMESHTASTIC_EXCLUDE_CANNEDMESSAGES=1
  -DMESHTASTIC_EXCLUDE_WAYPOINT=1
  -DMESHTASTIC_EXCLUDE_MQTT=0
  -DMESHTASTIC_EXCLUDE_BLUETOOTH=1
  -DMESHTASTIC_EXCLUDE_TEXTMESSAGE=1
  -DMESHTASTIC_EXCLUDE_WEBSERVER=1
  -DMESHTASTIC_EXCLUDE_POWERMON=1
  -DEXCLUDE_POWER_FSM=1
  -DUSERPREFS_CHANNELS_TO_WRITE=6
  -DUSERPREFS_CHANNEL_0_DOWNLINK_ENABLED=false
  -DUSERPREFS_CHANNEL_0_NAME=\"Fr_Balise\"
  -DUSERPREFS_CHANNEL_0_PRECISION=32
  -DUSERPREFS_CHANNEL_0_PSK={0xd4,0xf1,0xbb,0x3a,0x20,0x29,0x07,0x59,0xf0,0xbc,0xff,0xab,0xcf,0x4e,0x69,0x01}
  -DUSERPREFS_CHANNEL_0_UPLINK_ENABLED=true
  -DUSERPREFS_CHANNEL_1_DOWNLINK_ENABLED=false
  -DUSERPREFS_CHANNEL_1_NAME=\"Fr_EMCOMM\"
  -DUSERPREFS_CHANNEL_1_PSK={0xd4,0xf1,0xbb,0x3a,0x20,0x29,0x07,0x59,0xf0,0xbc,0xff,0xab,0xcf,0x4e,0x69,0x01}
  -DUSERPREFS_CHANNEL_1_UPLINK_ENABLED=true
  -DUSERPREFS_CHANNEL_2_DOWNLINK_ENABLED=false
  -DUSERPREFS_CHANNEL_2_NAME=\"Fr_BlaBla\"
  -DUSERPREFS_CHANNEL_2_PSK={0xd4,0xf1,0xbb,0x3a,0x20,0x29,0x07,0x59,0xf0,0xbc,0xff,0xab,0xcf,0x4e,0x69,0x01}
  -DUSERPREFS_CHANNEL_2_UPLINK_ENABLED=true
  -DUSERPREFS_CHANNEL_3_DOWNLINK_ENABLED=false
  -DUSERPREFS_CHANNEL_3_NAME=\"LongMod\"
  -DUSERPREFS_CHANNEL_3_PSK={0xd4,0xf1,0xbb,0x3a,0x20,0x29,0x07,0x59,0xf0,0xbc,0xff,0xab,0xcf,0x4e,0x69,0x01}
  -DUSERPREFS_CHANNEL_3_UPLINK_ENABLED=true
  -DUSERPREFS_CHANNEL_4_DOWNLINK_ENABLED=false
  -DUSERPREFS_CHANNEL_4_NAME=\"France\"
  -DUSERPREFS_CHANNEL_4_PSK={0xd4,0xf1,0xbb,0x3a,0x20,0x29,0x07,0x59,0xf0,0xbc,0xff,0xab,0xcf,0x4e,0x69,0x01}
  -DUSERPREFS_CHANNEL_4_UPLINK_ENABLED=true
  -DUSERPREFS_CHANNEL_5_DOWNLINK_ENABLED=false
  -DUSERPREFS_CHANNEL_5_NAME=\"R_ARA\"
  -DUSERPREFS_CHANNEL_5_PSK={0xd4,0xf1,0xbb,0x3a,0x20,0x29,0x07,0x59,0xf0,0xbc,0xff,0xab,0xcf,0x4e,0x69,0x01}
  -DUSERPREFS_CHANNEL_5_UPLINK_ENABLED=true
  -DUSERPREFS_CHANNEL_6_DOWNLINK_ENABLED=false
  -DUSERPREFS_CHANNEL_6_NAME=\"LongFast\"
  -DUSERPREFS_CHANNEL_6_PSK={0xd4,0xf1,0xbb,0x3a,0x20,0x29,0x07,0x59,0xf0,0xbc,0xff,0xab,0xcf,0x4e,0x69,0x01}
